<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Mintora/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla App Template</title>
    <script type="module" crossorigin src="/Mintora/index.js"></script>
    <link rel="stylesheet" crossorigin href="/Mintora/assets/styles-ClBjPdze.css">
  </head>
  <body>
    <header class="header">
  <div class="container container-header">
    <nav class="nav">
      <div class="nav__brand">
        <a class="nav__logo" href="./index.html" aria-label="Site logo">
          <svg class="nav__logo-icon">
            <use href="/Mintora/assets/sprite-C4GTkqFR.svg#logo"></use>
          </svg>
          <span class="nav__logo-text">DiveSea</span>
        </a>

        <ul class="nav__list">
          <li class="nav__item">
            <a class="nav__link {=$highlight-act}" href="./page-2.html"
              >Discover</a
            >
          </li>
          <li class="nav__item">
            <a class="nav__link {=$highlight-curr}" href="./page-3.html"
              >creators</a
            >
          </li>
          <li class="nav__item">
            <a class="nav__link {=$highlight-curr}" href="./page-3.html"
              >Sell</a
            >
          </li>
          <li class="nav__item">
            <a class="nav__link {=$highlight-curr}" href="./page-3.html"
              >stats</a
            >
          </li>
        </ul>
      </div>

      <div class="nav__actions">
        <div class="search">
          <svg class="search__icon">
            <use href="/Mintora/assets/sprite-C4GTkqFR.svg#search"></use>
          </svg>
          <input
            type="text"
            class="search__input"
            name="search"
            placeholder="Search Art Work / Creator"
          />
        </div>
        <button class="button btn--wallet">Connect Wallet</button>
      </div>
      <button class="nav__menu-button">
        <svg class="nav__menu-icon">
          <use href="/Mintora/assets/sprite-C4GTkqFR.svg#burger-menu"></use>
        </svg>
      </button>
    </nav>
  </div>
</header>


    <main>
      <!-- Loads the specified .html file -->
      <section class="vite-promo">
  <div class="container">
    <div class="vite-promo-thumb">
      <a
        class="vite-promo-link"
        href="https://vitejs.dev/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Link to Vite official website"
        title="Vite.js  build tool"
      >
        <!-- Path to images as from index.html file -->
        <img
          class="pic"
          src="/Mintora/assets/vite-logo-9o_aqrTe.png"
          alt="Vite logo"
          width="640"
          height="640"
        />
      </a>
    </div>
    <h1 class="main-title">
      <span class="main-title-gradient">Vite</span>
      Template by
      <a
        class="main-title-link"
        href="https://github.com/goitacademy/vanilla-app-template"
        target="_blank"
        rel="noopener noreferrer"
      >
        GoIT
      </a>
    </h1>
  </div>
</section>

      <article class="badges">
  <div class="container">
    <ul class="badges-list">
      <li class="badges-item">
        <a
          class="badges-link"
          href="https://www.npmjs.com/package/vite-plugin-html-inject"
          target="_blank"
          rel="noopener noreferrer"
        >
          HTML Inject
        </a>
      </li>
      <li class="badges-item">
        <a
          class="badges-link"
          href="https://www.npmjs.com/package/vite-plugin-full-reload"
          target="_blank"
          rel="noopener noreferrer"
        >
          Full Reload
        </a>
      </li>
      <li class="badges-item">
        <a
          class="badges-link"
          href="https://www.npmjs.com/package/postcss-sort-media-queries"
          target="_blank"
          rel="noopener noreferrer"
        >
          Sort Media Queries
        </a>
      </li>
    </ul>
  </div>
</article>

    </main>

    <footer class="footer">
  <div class="container">
    <p class="footer-desc">
      Made with ✨ by
      <a
        class="footer-link"
        href="https://goit.global/ua/"
        target="_blank"
        rel="noopener noreferrer"
      >
        GoIT team
      </a>
    </p>
  </div>
</footer>


  </body>
</html>
