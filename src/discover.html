<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page 2</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <load
      src="./partials/header.html"
      icon-path="./img/sprite.svg#logo"
      highlight-act="active"
    />

    <main>
      <div class="container container-discover">
        <h1 class="discover-title">Discover NFTs</h1>
        <div class="explore__sort">
          <button class="explore__btn">All</button>
          <button class="explore__btn">
            <svg class="explore__icon">
              <use href="./img/sprite.svg#category-icon"></use>
            </svg>
            <span>Category</span>
          </button>
          <button class="explore__btn">
            <svg class="explore__icon">
              <use href="./img/sprite.svg#collection-icon"></use>
            </svg>
            <span>Collection</span>
          </button>
          <button class="explore__btn">
            <svg class="explore__icon">
              <use href="./img/sprite.svg#explore-price-icon"></use>
            </svg>
            <span>Price</span>
          </button>
        </div>
        <ul class="nft-card nft-card--explore nft-card--discover"></ul>
        <div class="loader-wrapper"><span class="loader"></span></div>
        <div class="load-more-trigger"></div>
        <load src="./partials/back-link.html" />
      </div>
    </main>

    <load src="./partials/footer.html" />
    <script type="module" src="./js/discover.js"></script>
  </body>
</html>
