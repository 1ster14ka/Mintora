<section class="weekly-nft">
  <div class="container container-weekly">
    <h2 class="weekly-title">Weekly - Top NFT</h2>
    <div class="swiper">
      <ul class="nft-card nft-card--weekly swiper-wrapper"></ul>
    </div>
    <div class="hero__arrow-btn weekly__arrow-btn">
      <button class="weekly-slider-prev hero__arrow-btn--prev">
        <svg class="hero__arrow-icon">
          <use href="./img/sprite.svg#arrow-prev"></use>
        </svg>
      </button>
      <button class="weekly-slider-next hero__arrow-btn--next">
        <svg class="hero__arrow-icon">
          <use href="./img/sprite.svg#arrow-next"></use>
        </svg>
      </button>
    </div>
  </div>
</section>
